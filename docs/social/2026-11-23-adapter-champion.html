<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --bg:#0a0a0a; --panel:#131313; --line:#262626; --text:#ededed; --dim:#8f8f8f; --gold:#d4a53a; --gold-soft:#f0cf7a; --ok:#6fcf97; --bad:#e07a7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1600px; height:900px; background:var(--bg); color:var(--text); font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif; overflow:hidden; }
  .mono { font-family:"SF Mono",Menlo,Monaco,monospace; }
  .page { position:relative; width:1600px; height:900px; padding:52px 76px 0; background:
     radial-gradient(900px 520px at 88% -8%, rgba(212,165,58,.16), transparent 62%),
     radial-gradient(700px 480px at -6% 108%, rgba(212,165,58,.08), transparent 60%), var(--bg); }
  .grid { position:absolute; inset:0; background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:80px 80px; opacity:.22; mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 78%); }
  .top { position:relative; display:flex; align-items:center; justify-content:space-between; }
  .logo { height:84px; width:auto; display:block; margin-left:-6px; }
  .tag { font-size:17px; letter-spacing:.2em; color:var(--gold); border:1px solid rgba(212,165,58,.45); padding:10px 18px; border-radius:999px; text-transform:uppercase; }
  .cols { position:relative; display:grid; grid-template-columns:1.05fr .95fr; gap:72px; margin-top:92px; align-items:center; }
  .kicker { font-size:18px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); }
  .big { font-size:188px; line-height:.95; font-weight:700; letter-spacing:-.04em; color:var(--gold); margin-top:18px; }
  .big small { font-size:96px; letter-spacing:-.02em; }
  h1 { margin-top:26px; font-size:44px; line-height:1.15; font-weight:700; letter-spacing:-.015em; }
  h1 .mono { font-size:36px; color:var(--gold-soft); font-weight:600; letter-spacing:0; }
  .card { background:rgba(19,19,19,.9); border:1px solid var(--line); border-radius:22px; padding:34px 36px; }
  .row { display:grid; grid-template-columns:56px 1fr 120px auto; align-items:center; gap:18px; padding:20px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; padding-top:6px; } .row.win { padding-bottom:34px; }
  .v { font-size:26px; font-weight:700; color:var(--dim); }
  .bar { position:relative; height:12px; background:#1f1f1f; border-radius:99px; }
  .fill { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:#3a3a3a; }
  .floor { position:absolute; top:-10px; bottom:-10px; left:70%; width:2px; background:rgba(237,237,237,.55); }
  .sc { font-size:20px; color:var(--dim); text-align:right; line-height:1.2; } .sc i { display:block; font-style:normal; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#6a6a6a; margin-top:4px; } .win .sc { color:var(--text); }
  .flab { position:absolute; left:70%; top:22px; transform:translateX(-50%); font-size:13px; letter-spacing:.12em; color:var(--dim); white-space:nowrap; text-transform:uppercase; }
  .res { font-size:17px; letter-spacing:.14em; text-transform:uppercase; color:var(--bad); min-width:140px; text-align:right; }
  .win .v { color:var(--gold); }
  .win .fill { background:linear-gradient(90deg,#a9822a,var(--gold-soft)); }
  .win .res { color:var(--ok); }
  .legend { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; font-size:15px; color:var(--dim); letter-spacing:.06em; padding-right:168px; }
  .foot { position:absolute; left:0; right:0; bottom:0; height:98px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 76px; font-size:21px; color:var(--dim); }
  .foot .mono { color:var(--text); font-size:22px; }
</style></head>
