[package]
name = "truvian-scorer"
version = "0.1.0"
edition = "2021"
description = "Truvian ONCHAIN_TX_LOOKUP scoring module for Telegraph Protocol (Track 2)"

[lib]
crate-type = ["cdylib"]

[features]
default = ["real_weights"]
real_weights = []

[dependencies]
libm = { version = "0.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
