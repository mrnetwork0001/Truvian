# Truvian miner — nginx site (template).
# Install: copy to /etc/nginx/sites-available/truvian-miner.conf,
#   ln -s into sites-enabled, nginx -t, then reload. Certbot will add TLS:
#   sudo certbot --nginx -d miner.truvian.xyz
server {
    listen 80;
    listen [::]:80;
    server_name miner.truvian.xyz;

    # Track 2 scorer binaries (any version), served byte-exact for
    # registerWasm's re-hash check, from /var/www/truvian/.
    location ~ ^/truvian_scorer[a-z0-9_.-]*\.wasm$ {
        root /var/www/truvian;
        types { } default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
