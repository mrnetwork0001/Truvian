# Truvian Shield (Track 3) — nginx site (template).
# Install: copy to /etc/nginx/sites-available/truvian-shield.conf,
#   ln -s into sites-enabled, nginx -t, then reload. Certbot will add TLS
#   (rewrites this block to 443 + a port-80 redirect, same as it did for
#   the miner conf):
#   sudo certbot --nginx -d truvian.xyz -d www.truvian.xyz
#
# Prereq: DNS A records for truvian.xyz and www.truvian.xyz -> 38.49.213.208.

# ---------------------------------------------------------------------------
# (a) PRIMARY — Shield on the apex domain. Use this.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name truvian.xyz www.truvian.xyz;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/check fans out to several x402-paid Telegraph miner calls,
        # so allow more headroom than the miner's 30s.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ---------------------------------------------------------------------------
# (b) FALLBACK — only if truvian.xyz DNS is not live yet.
# Do NOT enable as-is: paste the location block below INTO the miner's
# existing server block (/etc/nginx/sites-available/truvian-miner.conf),
# which already serves miner.truvian.xyz, then nginx -t && reload.
# Shield then answers at https://miner.truvian.xyz/shield/.
#
# Caveat: the trailing slash on proxy_pass strips the /shield/ prefix, but
# any absolute asset/API path in the dashboard ("/app.js", fetch("/api/check"))
# escapes the prefix and 404s. A subpath is imperfect — prefer the apex
# server block above as soon as DNS resolves.
