version: "1"
kind: miner
id: 8453
slug: truvian-onchain-truth
protocol: generic
name: Truvian Exact On-Chain Truth Engine
base_url: https://miner.truvian.xyz
description: >
  Exact, independently reproducible on-chain answers read live from public
  JSON-RPC at request time, on Base, Ethereum, Arbitrum One, OP Mainnet,
  Polygon, BNB Smart Chain, Avalanche C-Chain, X Layer, Ethereum Sepolia and
  Base Sepolia. Transaction lookup returns the receipt-proven facts of a
  transaction: inclusion block, status, sender, recipient and native value,
  plus gas used, the true total fee including the OP-stack L1 data fee, and
  decoded ERC-20 transfers. A transaction with no receipt is reported pending
  and an unknown hash is reported not_found, never guessed. Gas price returns
  eth_gasPrice anchored to an explicit block, with base fee, priority-fee
  percentiles and the L1 base fee on OP-stack chains. Every response carries
  the intent's fields by name and a plain-language statement of the same facts.

docs:
  repository: https://github.com/mrnetwork0001/Truvian

auth:
  type: none

rate_limit_per_sec: 10
cache_ttl_sec: 2
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /tx
    external_path: /tx
    method: GET
    description: >
      Look up one transaction by its hash on an EVM chain and return its
      status (confirmed, reverted, pending or not_found), inclusion block
      number, sender, recipient and native value transferred.
    intents: [ONCHAIN_TX_LOOKUP_GENERAL]
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["*"]
            description: "Complete transaction hash: 0x followed by exactly 64 hexadecimal characters."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain the transaction is on, as a name or EIP-155 chain id. One of
              base (8453), ethereum (1), arbitrum (42161), optimism (10),
              polygon (137), bsc (56), avalanche (43114), xlayer (196),
              sepolia (11155111), base-sepolia (84532). When omitted, every
              listed chain is searched.
  - path: /gas
    external_path: /gas
    method: GET
    description: >
      Current gas price on an EVM chain in gwei, read from eth_gasPrice and
      anchored to the latest block, with base fee and priority-fee percentiles.
    intents: [GAS_PRICE_GENERAL]
    params:
      query:
        required:
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain to read, as a name or EIP-155 chain id. One of base (8453),
              ethereum (1), arbitrum (42161), optimism (10), polygon (137),
              bsc (56), avalanche (43114), xlayer (196), sepolia (11155111),
              base-sepolia (84532).

input_schema:
  type: object
  properties:
    tx_hash:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
      description: 0x-prefixed 32-byte transaction hash (for /tx).
    chain:
      type: string
      description: >-
        Chain name or EIP-155 chain id: base, ethereum, arbitrum, optimism,
        polygon, bsc, avalanche, xlayer, sepolia, base-sepolia.

output_schema:
  type: object
  properties:
    answer:
      type: string
      description: Plain-language statement of the exact on-chain facts.
    tx_hash:
      type: string
      description: "/tx: the transaction hash looked up, lower case."
    status:
      type: string
      enum: [confirmed, reverted, pending, not_found]
      description: "/tx: transaction status."
    from:
      type: string
      description: "/tx: sender address, EIP-55."
    to:
      type: string
      description: "/tx: recipient or contract address, EIP-55; null for a contract creation."
    block_number:
      type: integer
      description: "/tx: block the transaction was included in; null while pending or not found."
    value_eth:
      type: number
      description: "/tx: native value of the transaction in whole coins; the exact figure is valueWei."
    totalFeeWei:
      type: string
      description: "/tx: exact total cost in wei = gasUsed * effectiveGasPrice + l1Fee."
    chain:
      type: string
      description: Chain the answer refers to.
    chainId:
      type: integer
      description: EIP-155 id of that chain.
    gas_price_gwei:
      type: number
      description: "/gas: eth_gasPrice in gwei; the exact figure is gasPriceWei."
    as_of:
      type: string
      description: "/gas: timestamp of the block the reading is anchored to, ISO 8601 UTC."
    blockNumber:
      type: string
      description: Block the answer is anchored to, as a decimal string.
    source:
      type: string
      description: The JSON-RPC methods and chain the answer was derived from.
    confidence:
      type: number
      description: Confidence that live RPC reads completed successfully.
      minimum: 0
      maximum: 1

# Where each field of the intent's response format sits in our answer
# (GET /engine/v1/intents/<INTENT> -> response.fields). Our fields already use
# the intent's names and units, so every path is a direct read.
intent_mapping:
  ONCHAIN_TX_LOOKUP_GENERAL:
    endpoint: /tx
    input:
      tx_hash:
        from: tx_hash
        how: "Copy the complete 0x-prefixed 64-hex-character transaction hash exactly."
      chain:
        from: chain
        how: "Lower-case chain name such as ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, or the EIP-155 chain id."
    output:
      tx_hash: { path: tx_hash }
      status: { path: status }
      from: { path: from }
      to: { path: to }
      block_number: { path: block_number, unit: "block height" }
      value_eth: { path: value_eth, unit: "whole native units" }
  GAS_PRICE_GENERAL:
    endpoint: /gas
    input:
      chain:
        from: chain
        how: "Lower-case chain name such as ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, or the EIP-155 chain id."
    output:
      chain: { path: chain }
      gas_price_gwei: { path: gas_price_gwei, unit: gwei }
      as_of: { path: as_of }

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: signal
    reason_field: source
  supported_intents:
    - ONCHAIN_TX_LOOKUP_GENERAL
    - GAS_PRICE_GENERAL
