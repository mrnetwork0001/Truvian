version: "1"
kind: miner
id: 8453
slug: truvian-onchain-truth
protocol: generic
name: Truvian Exact On-Chain Truth Engine
base_url: https://miner.truvian.xyz
description: >
  Exact, independently reproducible on-chain answers read live from public
  JSON-RPC at request time, on Base, Ethereum, Arbitrum One, OP Mainnet,
  Polygon, BNB Smart Chain, Avalanche C-Chain, X Layer, Ethereum Sepolia and
  Base Sepolia. Transaction lookup returns the receipt-proven facts of a
  transaction: inclusion block, status, sender, recipient and native value,
  plus gas used, the true total fee including the OP-stack L1 data fee, and
  decoded ERC-20 transfers. A transaction with no receipt is reported pending
  and an unknown hash is reported not_found, never guessed. Gas price returns
  eth_gasPrice anchored to an explicit block, with base fee, priority-fee
  percentiles and the L1 base fee on OP-stack chains. Wallet balance returns
  the native-coin or ERC-20 balance of an address or ENS name, and total
  supply returns an ERC-20's supply, both with decimals applied and anchored
  to one block. Transfer verification says whether a transaction settled,
  with its confirmations, the fee and its burned base fee and L1 data fee,
  and the token amounts it moved. Pool liquidity returns a DEX pool's USD
  liquidity from its on-chain reserves at one block, priced by DefiLlama and
  checked against GeckoTerminal. Every response carries the intent's fields
  by name and a plain-language statement of the same facts.

docs:
  repository: https://github.com/mrnetwork0001/Truvian

auth:
  type: none

rate_limit_per_sec: 10
cache_ttl_sec: 2
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /tx
    external_path: /tx
    method: GET
    description: >
      Look up one transaction by its hash on an EVM chain and return its
      status (confirmed, reverted, pending or not_found), inclusion block
      number, sender, recipient and native value transferred.
    intents: [ONCHAIN_TX_LOOKUP_GENERAL]
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["*"]
            description: "Complete transaction hash: 0x followed by exactly 64 hexadecimal characters."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain the transaction is on, as a name or EIP-155 chain id. One of
              base (8453), ethereum (1), arbitrum (42161), optimism (10),
              polygon (137), bsc (56), avalanche (43114), xlayer (196),
              sepolia (11155111), base-sepolia (84532). When omitted, every
              listed chain is searched.
  - path: /gas
    external_path: /gas
    method: GET
    description: >
      Current gas price on an EVM chain in gwei, read from eth_gasPrice and
      anchored to the latest block, with base fee and priority-fee percentiles.
    intents: [GAS_PRICE_GENERAL]
    params:
      query:
        required:
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain to read, as a name or EIP-155 chain id. One of base (8453),
              ethereum (1), arbitrum (42161), optimism (10), polygon (137),
              bsc (56), avalanche (43114), xlayer (196), sepolia (11155111),
              base-sepolia (84532).

  - path: /balance
    external_path: /balance
    method: GET
    description: >
      Current balance of one address or ENS name on an EVM chain, or of a
      Solana wallet on mainnet-beta or devnet, in whole units of the native
      coin or of a token (ERC-20 or SPL, Token and Token-2022), with decimals
      applied.
    intents: [WALLET_BALANCE_CHECK_GENERAL]
    params:
      query:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: "The wallet: a 0x address (40 hexadecimal characters), an ENS name ending in .eth, or a base58 Solana address."
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain to read, as a name or EIP-155 chain id: ethereum (1), base
              (8453), arbitrum (42161), optimism (10), polygon (137), bsc (56),
              avalanche (43114), scroll, linea, gnosis, zksync, xlayer, sepolia,
              base-sepolia, solana (mainnet-beta), solana-devnet.
        optional:
          - name: token
            type: string
            intents: ["*"]
            description: >-
              ERC-20 contract address or Solana mint address, or a symbol (USDC,
              USDT, DAI, WETH, WBTC; on Solana USDC, USDT, PYUSD); empty or the
              native symbol (ETH, POL, BNB, AVAX, SOL) for the chain's native
              coin.
  - path: /total-supply
    external_path: /total-supply
    method: GET
    description: >
      Current total supply of one ERC-20 token, in whole tokens with decimals
      applied, read from totalSupply() on its contract; or of one Solana SPL
      mint (Token or Token-2022), read from the mint account.
    intents: [TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: token
            type: string
            intents: ["*"]
            description: >-
              The token and its chain as given, for example "USDC
              (0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48) on Ethereum"; a
              contract address is used when present, otherwise a symbol.
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: Chain name or EIP-155 chain id, when not named in token. Defaults to ethereum.
  - path: /transfer
    external_path: /transfer
    method: GET
    description: >
      Verify one on-chain transfer by its transaction hash: whether it settled
      (confirmed, reverted, pending or not found), its block and number of
      confirmations, sender and recipient, native value, the fee paid with the
      base fee burned and any L1 data fee, and the ERC-20 amounts it moved.
    intents: [CRYPTO_TRANSFER_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["*"]
            description: "Complete transaction hash: 0x followed by exactly 64 hexadecimal characters, or a base58 Solana transaction signature."
        optional:
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain the transaction is on, as a name or EIP-155 chain id
              (ethereum, base, arbitrum, optimism, polygon, bsc, avalanche,
              scroll, linea, gnosis, zksync, xlayer, sepolia, base-sepolia,
              solana, solana-devnet). When omitted, every listed chain is
              searched.
  - path: /liquidity
    external_path: /liquidity
    method: GET
    description: >
      Total liquidity in US dollars of one DEX pool: the pool's on-chain
      reserves of its two tokens at one block, each priced in USD.
    intents: [LIQUIDITY_DEPTH_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: pool
            type: string
            intents: ["*"]
            description: >-
              The pool's contract address, or its name with its tokens and fee
              tier, such as "WETH / USDC 0.05%".
          - name: chain
            type: string
            intents: ["*"]
            description: >-
              Chain the pool is on: ethereum, base, arbitrum, optimism,
              polygon, bsc, avalanche, scroll, linea, gnosis or zksync, or the
              EIP-155 chain id.
input_schema:
  type: object
  properties:
    tx_hash:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
      description: 0x-prefixed 32-byte transaction hash (for /tx).
    chain:
      type: string
      description: >-
        Chain name or EIP-155 chain id: base, ethereum, arbitrum, optimism,
        polygon, bsc, avalanche, xlayer, sepolia, base-sepolia.
    pool:
      type: string
      description: "/liquidity: the DEX pool's contract address, or its name with tokens and fee tier."

output_schema:
  type: object
  properties:
    answer:
      type: string
      description: Plain-language statement of the exact on-chain facts.
    tx_hash:
      type: string
      description: "/tx: the transaction hash looked up, lower case."
    status:
      type: string
      enum: [confirmed, reverted, pending, not_found]
      description: "/tx: transaction status."
    from:
      type: string
      description: "/tx: sender address, EIP-55."
    to:
      type: string
      description: "/tx: recipient or contract address, EIP-55; null for a contract creation."
    block_number:
      type: integer
      description: "/tx: block the transaction was included in; null while pending or not found."
    value_eth:
      type: number
      description: "/tx: native value of the transaction in whole coins; the exact figure is valueWei."
    totalFeeWei:
      type: string
      description: "/tx: exact total cost in wei = gasUsed * effectiveGasPrice + l1Fee."
    chain:
      type: string
      description: Chain the answer refers to.
    chainId:
      type: integer
      description: EIP-155 id of that chain.
    gas_price_gwei:
      type: number
      description: "/gas: eth_gasPrice in gwei; the exact figure is gasPriceWei."
    as_of:
      type: string
      description: "/gas: timestamp of the block the reading is anchored to, ISO 8601 UTC."
    blockNumber:
      type: string
      description: Block the answer is anchored to, as a decimal string.
    source:
      type: string
      description: The JSON-RPC methods and chain the answer was derived from.
    confirmations:
      type: integer
      description: "/transfer: blocks confirming the transaction, counting its own, at response time."
    fee_total_native:
      type: string
      description: "/transfer: everything the sender paid, in whole native coins, exact."
    fee_burned_native:
      type: string
      description: "/transfer: the base fee part of the fee, burned under EIP-1559; null where the block has no base fee."
    liquidity_usd:
      type: number
      description: "/liquidity: the pool's total liquidity in USD at block_number, 6 decimals."
    pool_address:
      type: string
      description: "/liquidity: the pool read, EIP-55."
    confidence:
      type: number
      description: Confidence that live RPC reads completed successfully.
      minimum: 0
      maximum: 1

# Where each field of the intent's response format sits in our answer
# (GET /engine/v1/intents/<INTENT> -> response.fields). Our fields already use
# the intent's names and units, so every path is a direct read.
intent_mapping:
  ONCHAIN_TX_LOOKUP_GENERAL:
    endpoint: /tx
    input:
      tx_hash:
        from: tx_hash
        how: "Copy the complete 0x-prefixed 64-hex-character transaction hash exactly."
      chain:
        from: chain
        how: "Lower-case chain name such as ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, or the EIP-155 chain id."
    output:
      tx_hash: { path: tx_hash }
      status: { path: status }
      from: { path: from }
      to: { path: to }
      block_number: { path: block_number, unit: "block height" }
      value_eth: { path: value_eth, unit: "whole native units" }
  GAS_PRICE_GENERAL:
    endpoint: /gas
    input:
      chain:
        from: chain
        how: "Lower-case chain name such as ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, or the EIP-155 chain id."
    output:
      chain: { path: chain }
      gas_price_gwei: { path: gas_price_gwei, unit: gwei }
      as_of: { path: as_of }

  WALLET_BALANCE_CHECK_GENERAL:
    endpoint: /balance
    input:
      address:
        from: address
        how: "Copy the 0x address, ENS name or base58 Solana address exactly."
      chain:
        from: chain
        how: "Lower-case chain name such as ethereum, base, arbitrum, optimism, polygon, solana or solana-devnet, or the EIP-155 chain id."
      token:
        from: token
        how: "The token's contract address if given, otherwise its symbol; leave empty for the native coin."
    output:
      address: { path: address }
      chain: { path: chain }
      balance: { path: balance, unit: "whole token units" }
      token_symbol: { path: token_symbol }
      as_of: { path: as_of }
  TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL:
    endpoint: /total-supply
    input:
      token:
        from: token
        how: "Copy the token reference as given, including any contract address and chain."
    output:
      total_supply: { path: total_supply, unit: "whole tokens" }
  LIQUIDITY_DEPTH_VERIFY_GENERAL:
    endpoint: /liquidity
    input:
      pool:
        from: pool
        how: "Copy the pool's contract address if given, otherwise its name with tokens and fee tier."
      chain:
        from: chain
        how: "Lower-case chain name such as ethereum, base, arbitrum, optimism, polygon, bsc, or the EIP-155 chain id."
    output:
      liquidity_usd: { path: liquidity_usd, unit: USD }
semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: signal
    reason_field: source
  supported_intents:
    - ONCHAIN_TX_LOOKUP_GENERAL
    - GAS_PRICE_GENERAL
    - WALLET_BALANCE_CHECK_GENERAL
    - TOKEN_TOTAL_SUPPLY_VERIFY_GENERAL
    - CRYPTO_TRANSFER_VERIFY_GENERAL
    - LIQUIDITY_DEPTH_VERIFY_GENERAL
