version: "1"
kind: miner
id: 8453
slug: truvian-onchain-truth
protocol: generic
name: Truvian Exact On-Chain Truth Engine
base_url: https://miner.truvian.xyz
description: >
  Deterministic, exactly-verifiable on-chain answers for Base and Ethereum,
  read live from JSON-RPC at request time. ONCHAIN_TX_LOOKUP returns the full
  canonical facts of a transaction — status, block, addresses, value, gas, and
  the true total fee including the OP-stack L1 data fee that naive
  implementations drop — decoded ERC-20 transfers included. GAS_PRICE returns
  a block-anchored fee snapshot with EIP-1559 percentiles and L1 base fee.
  Every response leads with a number-first plain-language answer followed by
  the complete structured payload, and every figure is independently
  reproducible from public RPC.

docs:
  repository: https://github.com/mrnetwork0001/Truvian

input_schema:
  type: object
  properties:
    chain:
      type: string
      description: "Chain name: base (default), ethereum, or xlayer. Aliases accepted: eth, mainnet."
    hash:
      type: string
      description: "0x-prefixed 32-byte transaction hash (for /tx)."
    query:
      type: string
      description: "Natural-language question; a contained tx hash or chain name is extracted."

output_schema:
  type: object
  properties:
    answer:
      type: string
      description: Number-first natural-language statement of the exact on-chain facts.
    signal:
      type: string
      description: Short label (transaction status word, or gas-price).
    source:
      type: string
      description: The JSON-RPC methods and chain the answer was derived from.
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: Confidence that live RPC reads completed successfully.
    chainId:
      type: integer
      description: EVM chain id the answer refers to.
    blockNumber:
      type: string
      description: Block the answer is anchored to.
    totalFeeWei:
      type: string
      description: "ONCHAIN_TX_LOOKUP: exact total cost in wei = gasUsed * effectiveGasPrice + l1Fee."
    gasPriceWei:
      type: string
      description: "GAS_PRICE: current eth_gasPrice as a decimal wei string."

endpoints:
  - path: /tx
    external_path: /tx
    method: GET
    description: >
      Look up a transaction by hash (ONCHAIN_TX_LOOKUP). Params: hash (or
      tx_hash/txHash, or a query containing one), chain (default base).
      Returns status, block, from/to, value, gas used, effective gas price,
      exact total fee in wei including L1 data fee, and decoded ERC-20
      transfers.
  - path: /gas
    external_path: /gas
    method: GET
    description: >
      Current gas prices for a chain (GAS_PRICE). Params: chain (default
      base) or a natural-language query. Returns eth_gasPrice, base fee,
      priority fee, 5-block EIP-1559 percentiles, and L1 base fee, all
      anchored to an explicit block number.

auth:
  type: none

rate_limit_per_sec: 10
cache_ttl_sec: 2
circuit_threshold: 5
circuit_cooldown_seconds: 30

semantics:
  supported_intents:
    - ONCHAIN_TX_LOOKUP
    - GAS_PRICE
  signal_mapping:
    confidence_field: confidence
    label_field: signal
    reason_field: source
